[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editable-symbolic-kb"
version = "0.1.0"
description = "Local frozen LLM, persistent assertions, and bounded Prolog inference"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
research-kb = "kb.cli:main"

[tool.setuptools.package-data]
kb = ["*.pl", "domains/*.pl"]

[tool.setuptools.packages.find]
include = ["kb*"]
